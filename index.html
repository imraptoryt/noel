<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DARKNET TERMINAL v3.7</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #000;
    color: #00ff41;
    font-family: 'Courier New', Courier, monospace;
    height: 100%;
    overflow: hidden;
  }
  #matrix-bg {
    position: fixed; top:0; left:0;
    width:100%; height:100%;
    z-index:1; opacity:0.12;
    pointer-events:none;
  }

  /* ========== INTRO : MINI-JEU SAHP ========== */
  #intro-screen {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: radial-gradient(ellipse at center, #0a1929 0%, #050b14 70%, #02050a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cbd5e1;
    font-family: 'Courier New', monospace;
    transition: opacity 0.6s;
  }
  #intro-screen.hide { opacity: 0; pointer-events: none; }
  .sahp-panel {
    width: min(680px, 94vw);
    background: #0a1929;
    border: 2px solid #00d0ff;
    border-radius: 8px;
    padding: 22px 26px;
    box-shadow: 0 0 30px rgba(0,208,255,0.35), inset 0 0 30px rgba(0,208,255,0.05);
    position: relative;
  }
  .sahp-panel::before, .sahp-panel::after {
    content:''; position:absolute; left:0; right:0; height:6px;
    background: repeating-linear-gradient(45deg, #fbbf24 0 8px, #0a1929 8px 16px);
  }
  .sahp-panel::before { top:-2px; border-radius: 6px 6px 0 0; }
  .sahp-panel::after { bottom:-2px; border-radius: 0 0 6px 6px; }
  .sahp-title {
    text-align: center;
    color: #00d0ff;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 4px;
    text-shadow: 0 0 12px #00d0ff;
    margin: 8px 0 4px;
  }
  .sahp-subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 11px;
    letter-spacing: 3px;
    margin-bottom: 18px;
  }
  .sahp-timer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 2px;
    color: #94a3b8;
    margin-bottom: 4px;
  }
  .sahp-timer-bar {
    height: 3px;
    background: #1e293b;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .sahp-timer-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #00d0ff, #38bdf8);
    box-shadow: 0 0 8px #00d0ff;
    transition: width 0.1s linear;
  }
  .sahp-target {
    background: #0f1f33;
    border: 1px solid #1e3a5f;
    border-radius: 6px;
    padding: 14px 18px;
    margin-bottom: 16px;
  }
  .sahp-target-label {
    text-align: center;
    color: #94a3b8;
    font-size: 10px;
    letter-spacing: 4px;
    margin-bottom: 10px;
  }
  .sahp-target-cells {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .sahp-target-cell {
    width: 60px;
    padding: 10px 0;
    text-align: center;
    background: #0a1929;
    border: 1px solid #1e3a5f;
    border-radius: 4px;
    font-size: 16px;
    letter-spacing: 1px;
    color: #cbd5e1;
    font-weight: bold;
    transition: all 0.2s;
  }
  .sahp-target-cell.active {
    border-color: #00d0ff;
    background: #0c2540;
    box-shadow: 0 0 10px rgba(0,208,255,0.6), inset 0 0 8px rgba(0,208,255,0.2);
    color: #00d0ff;
    text-shadow: 0 0 8px #00d0ff;
  }
  .sahp-target-cell.done {
    border-color: #16a34a;
    background: #052e1a;
    color: #16a34a;
  }
  .sahp-arrow { color: #475569; font-size: 16px; }
  .sahp-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .sahp-cell {
    background: #0f1f33;
    border: 1px solid #1e3a5f;
    border-radius: 4px;
    padding: 14px 0;
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #cbd5e1;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .sahp-cell:hover {
    background: #1a3050;
    border-color: #00d0ff;
    color: #00d0ff;
    transform: translateY(-1px);
  }
  .sahp-cell.found {
    background: #052e1a;
    border-color: #16a34a;
    color: #16a34a;
    cursor: default;
    pointer-events: none;
  }
  .sahp-cell.wrong { animation: shakeRed 0.4s; }
  .sahp-status {
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #94a3b8;
    min-height: 18px;
  }
  .sahp-status.fail { color: #ef4444; text-shadow: 0 0 8px #ef4444; }
  .sahp-status.win  { color: #16a34a; text-shadow: 0 0 8px #16a34a; }
  @keyframes shakeRed {
    0%,100% { background:#0f1f33; border-color:#1e3a5f; color:#cbd5e1; transform:translateX(0);}
    25%     { background:#3b0a0a; border-color:#ef4444; color:#ef4444; transform:translateX(-4px);}
    75%     { background:#3b0a0a; border-color:#ef4444; color:#ef4444; transform:translateX(4px);}
  }

  /* ========== TERMINAL ========== */
  #terminal {
    position: relative;
    z-index: 2;
    padding: 18px;
    height: 100vh;
    overflow-y: auto;
    text-shadow: 0 0 5px #00ff41;
    font-size: 15px;
    line-height: 1.35;
  }
  .line { margin: 1px 0; white-space: pre-wrap; word-wrap: break-word; }
  .error   { color:#ff2640; text-shadow:0 0 5px #ff2640; }
  .warning { color:#ffaa00; text-shadow:0 0 5px #ffaa00; }
  .success { color:#00ff41; }
  .info    { color:#00d0ff; text-shadow:0 0 5px #00d0ff; }
  .dim     { opacity:0.45; }
  .big     { font-size:18px; font-weight:bold; }
  .glitch { animation: glitch 0.25s steps(2) infinite; display:inline-block; }
  @keyframes glitch {
    0%   { transform: translate(0,0);   text-shadow:0 0 4px #00ff41; }
    25%  { transform: translate(-2px,1px); text-shadow:2px 0 #ff00ff,-2px 0 #00ffff; }
    50%  { transform: translate(2px,-1px); text-shadow:-2px 0 #ff00ff,2px 0 #00ffff; }
    75%  { transform: translate(-1px,-2px); }
    100% { transform: translate(0,0); }
  }
  #input-line { display:flex; align-items:center; padding: 4px 0; }
  #prompt { margin-right:8px; color:#00ff41; white-space: nowrap; }
  #cmd-input {
    background: transparent; border: none;
    color: #00ff41;
    font-family: 'Courier New', monospace;
    font-size: 15px;
    flex: 1; outline: none;
    text-shadow:0 0 5px #00ff41;
    caret-color: #00ff41;
  }
  .ascii-art {
    color:#00ff41; font-size: 10px; line-height: 11px;
    margin: 4px 0; white-space: pre;
  }
  .box { color:#00d0ff; text-shadow:0 0 5px #00d0ff; font-weight:bold; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background:#001a05; }
  ::-webkit-scrollbar-thumb { background:#00ff41; }
</style>
</head>

<!-- ========== INTRO : MINI-JEU SAHP ========== -->
<div id="intro-screen">
  <div class="sahp-panel">

    </div>

<script>
/* ============ MINI-JEU INTRO : SAHP ============ */
const introScreen = document.getElementById('intro-screen');
const sahpGrid    = document.getElementById('sahp-grid');
const sahpTarget  = document.getElementById('sahp-target');
const sahpTimerEl = document.getElementById('sahp-time');
const sahpFill    = document.getElementById('sahp-timer-fill');
const sahpStatus  = document.getElementById('sahp-status');

const SAHP_DURATION = 10;
let sahpInterval = null;
let sahpTimeLeft = SAHP_DURATION;
let sahpSequence = [];
let sahpStep = 0;
let sahpGridCodes = [];
let sahpFinished = false;

function randHex(){
  return Math.floor(Math.random()*256).toString(16).toUpperCase().padStart(2,'0');
}
function shuffle(arr){
  for (let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function setupSAHP(){
  const set = new Set();
  while (set.size < 4) set.add(randHex());
  sahpSequence = [...set];

  const allCodes = new Set(sahpSequence);
  while (allCodes.size < 25) allCodes.add(randHex());
  sahpGridCodes = shuffle([...allCodes]);

  sahpTarget.innerHTML = '';
  sahpSequence.forEach((code, i) => {
    if (i > 0){
      const arrow = document.createElement('span');
      arrow.className = 'sahp-arrow';
      arrow.textContent = '▸';
      sahpTarget.appendChild(arrow);
    }
    const c = document.createElement('div');
    c.className = 'sahp-target-cell' + (i === 0 ? ' active' : '');
    c.textContent = code;
    c.dataset.idx = i;
    sahpTarget.appendChild(c);
  });

  sahpGrid.innerHTML = '';
  sahpGridCodes.forEach(code => {
    const cell = document.createElement('div');
    cell.className = 'sahp-cell';
    cell.textContent = code;
    cell.dataset.code = code;
    cell.addEventListener('click', () => onSahpClick(cell));
    sahpGrid.appendChild(cell);
  });

  sahpStep = 0;
  sahpTimeLeft = SAHP_DURATION;
  sahpFinished = false;
  sahpStatus.textContent = '\u00A0';
  sahpStatus.className = 'sahp-status';
  sahpFill.style.width = '100%';
  sahpTimerEl.textContent = SAHP_DURATION.toFixed(1)+'s';

  clearInterval(sahpInterval);
  sahpInterval = setInterval(tickSAHP, 100);
}

function tickSAHP(){
  if (sahpFinished) return;
  sahpTimeLeft -= 0.1;
  if (sahpTimeLeft <= 0){
    sahpTimeLeft = 0;
    sahpTimerEl.textContent = '0.0s';
    sahpFill.style.width = '0%';
    failSAHP('TEMPS ECOULE - NOUVELLE TENTATIVE');
    return;
  }
  sahpTimerEl.textContent = sahpTimeLeft.toFixed(1)+'s';
  sahpFill.style.width = (sahpTimeLeft / SAHP_DURATION * 100) + '%';
}

function onSahpClick(cell){
  if (sahpFinished) return;
  const code = cell.dataset.code;
  const expected = sahpSequence[sahpStep];

  if (code === expected){
    cell.classList.add('found');
    const tc = sahpTarget.querySelectorAll('.sahp-target-cell');
    tc[sahpStep].classList.remove('active');
    tc[sahpStep].classList.add('done');
    sahpStep++;
    if (sahpStep >= sahpSequence.length){
      winSAHP();
    } else {
      tc[sahpStep].classList.add('active');
    }
  } else {
    cell.classList.add('wrong');
    setTimeout(()=>cell.classList.remove('wrong'), 400);
    failSAHP('CODE INCORRECT - SEQUENCE REINITIALISEE');
  }
}

function failSAHP(msg){
  sahpStatus.textContent = msg;
  sahpStatus.className = 'sahp-status fail';
  clearInterval(sahpInterval);
  setTimeout(setupSAHP, 1200);
}

function winSAHP(){
  sahpFinished = true;
  clearInterval(sahpInterval);
  sahpStatus.textContent = 'PROTOCOLE DECRYPTE - ACCES DARKNET AUTORISE';
  sahpStatus.className = 'sahp-status win';
  setTimeout(() => {
    introScreen.classList.add('hide');
    setTimeout(() => {
      introScreen.style.display = 'none';
      bootSequence();
    }, 650);
  }, 1000);
}

setupSAHP();

/* ============ MATRIX BACKGROUND ============ */
const canvas = document.getElementById('matrix-bg');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);
const mxChars = '01ABCDEF$#@!*&%<>?/\\';
const fontSize = 14;
let drops = [];
function initDrops(){
  drops = [];
  const cols = Math.floor(canvas.width / fontSize);
  for (let i=0;i<cols;i++) drops.push(Math.random()*-50);
}
initDrops();
addEventListener('resize', initDrops);
setInterval(()=>{
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#00ff41';
  ctx.font = fontSize+'px monospace';
  for (let i=0;i<drops.length;i++){
    const ch = mxChars[Math.floor(Math.random()*mxChars.length)];
    ctx.fillText(ch, i*fontSize, drops[i]*fontSize);
    if (drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}, 55);

/* ============ TERMINAL ============ */
const output = document.getElementById('output');
const inputLine = document.getElementById('input-line');
const cmdInput = document.getElementById('cmd-input');
const promptEl = document.getElementById('prompt');
const terminal = document.getElementById('terminal');

let stage = 'boot';
let state = {};

const sleep = ms => new Promise(r=>setTimeout(r,ms));
function scrollDown(){ terminal.scrollTop = terminal.scrollHeight; }

function addLine(text, cls=''){
  const d = document.createElement('div');
  d.className = 'line '+cls;
  d.textContent = text;
  output.appendChild(d);
  scrollDown();
  return d;
}
function addHTML(html, cls=''){
  const d = document.createElement('div');
  d.className = 'line '+cls;
  d.innerHTML = html;
  output.appendChild(d);
  scrollDown();
  return d;
}
async function typeLine(text, cls='', speed=15){
  const d = document.createElement('div');
  d.className = 'line '+cls;
  output.appendChild(d);
  for (let i=0;i<text.length;i++){
    d.textContent += text[i];
    scrollDown();
    await sleep(speed);
  }
  return d;
}

  '> 0x7FA3...injecting payload...',
  '> SEGFAULT @ 0xDEADBEEF',
  '> kernel panic: not syncing!',
  '> TCP/IP stack corrupted -> rerouting...',
  '> buffer overflow detected in /lib/ssl',
  '> 01001000 01100001 01100011 01101011',
  '> rm -rf /sys/firewall/log/*',

  '> WARN: trace route diverted via TOR-node-7',
  '> XOR key rotation failed... retry',

  '> sudo: command from /tmp/.shadow.bin',
  '> eth0: link down... reconnecting in 2s',

  '> [hex] 0x00ff41 0xdeadc0de 0xcafebabe',
  '> proxy chain: TOR -> VPN -> SSH -> ...',

  for (let i=0;i<count;i++){
    const c = fakeCodes[Math.floor(Math.random()*fakeCodes.length)];
    addLine(c, 'dim glitch');
    await sleep(delay);

function showInput(){ inputLine.style.display='flex'; cmdInput.value=''; cmdInput.focus(); scrollDown(); }
function hideInput(){ inputLine.style.display='none'; }

  addHTML(`<pre class="ascii-art success">
 ████████▄     ▄████████    ▄████████    ▄█   ▄█▄  ███▄▄▄▄      ▄████████     ███     
 ███   ▀███   ███    ███   ███    ███   ███ ▄███▀  ███▀▀▀██▄   ███    ███ ▀█████████▄ 
 ███    ███   ███    ███   ███    ███   ███▐██▀    ███   ███   ███    █▀     ▀███▀▀██ 
 ███    ███   ███    ███  ▄███▄▄▄▄██▀  ▄█████▀     ███   ███  ▄███▄▄▄         ███   ▀ 
 ███    ███ ▀███████████ ▀▀███▀▀▀▀▀   ▀▀█████▄     ███   ███ ▀▀███▀▀▀         ███

 ███   ▄███   ███    ███   ███    ███   ███ ▀███▄  ███   ███   ███    ███     ███

async function startGame3(){
  hideInput();
  await glitchBurst(5, 60);
  addLine('', '');
  addLine('+============================================+', 'info');
  addLine('|  DEFI 3/3 - CRYPTANALYSE BINAIRE (DUR)     |', 'info');
  addLine('+============================================+', 'info');
  await sleep(300);

  await typeLine('Tu dois CONVERTIR chaque cle en DECIMAL puis ADDITIONNER les 3 resultats.', '', 12);

  addLine('  COMMANDE A TAPER :  sum <total>', 'info');
  addLine('  (exemple : sum 123)', 'dim');
  stage = 'game3';
  promptEl.textContent = 'hacker@vault:~$';
  showInput();
}

async function finalReveal(){

  await glitchBurst(10, 50);
  addLine('', '');
  await typeLine('[CRITIQUE] Acces au coffre-fort principal accorde...', 'warning', 14);
  await sleep(400);
  await typeLine('[SYSTEME] Decryptage du code final en cours...', 'info', 14);
  await sleep(500);
  for (const p of [10,25,40,55,70,85,100]){
    addLine('[SYSTEME] Progression : '+p+'%  '+'#'.repeat(Math.floor(p/5)), 'info');
    if (p === 55) await glitchBurst(3, 50);
    await sleep(250);
  }
  await sleep(400);
  addLine('[SYSTEME] CODE DECRYPTE AVEC SUCCES', 'success');
  addLine('', '');
  await sleep(300);
  addHTML(`<pre class="ascii-art success big">
   +============================================+
   |                                            |
   |    A C C E S   A U T O R I S E             |
   |    Coffre-fort principal OUVERT            |
   |                                            |
   |          +----------------------+          |
   |          |   C O D E :  2 9 4 1 |          |
   |          +----------------------+          |
   |                                            |
   |    STATUT : MISSION REUSSIE                |
   |    TEMPS  : INDETECTABLE                   |
   |    TRACE  : EFFACEE                        |
   |                                            |
   +============================================+
  </pre>`);
  await sleep(300);

async function handleCommand(raw){
  const cmd = raw.trim();
  addLine(promptEl.textContent + ' ' + cmd, '');
  const c = cmd.toLowerCase();
  if (!c) { showInput(); return; }

  if (stage === 'menu'){
    if (c === 'help'){
      addLine('Commandes disponibles :', 'info');
      addLine('  start    - commencer la mission', 'info');
      addLine('  help     - afficher cette aide', 'info');
      addLine('  clear    - effacer l\'ecran', 'info');
      addLine('  whoami   - identite actuelle', 'info');
    } else if (c === 'start'){
      await startGame1();
      return;
    } else if (c === 'clear'){
      output.innerHTML = '';
    } else if (c === 'whoami'){
      addLine('hacker_anonyme_42 | rang: SCRIPT_KIDDIE | ip: spoofed', 'success');
    } else {
      addLine('Commande inconnue : '+cmd, 'error');
      addLine('Tape "help" pour la liste.', 'warning');
    }
  }
  else if (stage === 'game1'){
    if (c === 'help'){
      addLine('Tape : decrypt <mot>', 'info');
      addLine('Decale chaque lettre de KDFN de -3 dans l\'alphabet.', 'info');
      addLine('K->H,  D->A,  F->C,  K->H', 'dim');
    } else if (c.startsWith('decrypt ')){
      const ans = c.split(/\s+/)[1] || '';
      if (ans === 'hack'){
        await glitchBurst(2, 60);
        addLine('[ OK ] Decryptage reussi : KDFN -> HACK', 'success');
        addLine('[ OK ] Message decrypte : "HACK"', 'success');
        await sleep(500);
        await startGame2();
        return;
      } else {
        addLine('[ ERR ] Mauvais decryptage : "'+ans+'"', 'error');
        addLine('Indice : K(-3)=H ... continue avec D, F, K', 'warning');
      }
    } else if (c === 'clear'){
      output.innerHTML = '';
    } else {
      addLine('Commande inconnue. Utilise : decrypt <mot>', 'error');
    }
  }
  else if (stage === 'game2'){
    const seq = ['scan','connect','bypass','inject'];
    const step = state.g2;
    if (c === 'help'){
      addLine('Sequence a respecter : scan -> connect -> bypass -> inject', 'info');
      addLine('Etape actuelle : '+step+'/4 -> tape "'+seq[step-1]+'"', 'info');
    } else if (c === 'clear'){
      output.innerHTML = '';
    } else if (c === seq[step-1]){
      if (step === 1){
        addLine('[ SCAN ] Lancement nmap...', 'success');
        addLine('[ SCAN ] Ports ouverts trouves : 22, 80, 443, 8080, 31337', 'success');
        addLine('>>> ETAPE 2/4 - tape "connect"', 'warning');
      } else if (step === 2){
        addLine('[CONNECT] Connexion au port 31337...', 'success');
        addLine('[CONNECT] Reverse shell etabli !', 'success');
        addLine('>>> ETAPE 3/4 - tape "bypass"', 'warning');
      } else if (step === 3){
        addLine('[BYPASS] Exploitation faille CVE-2024-XX42...', 'success');
        addLine('[BYPASS] Firewall contourne, IDS desactive.', 'success');
        addLine('>>> ETAPE 4/4 - tape "inject"', 'warning');
      } else if (step === 4){
        addLine('[INJECT] Injection du payload (1024 octets)...', 'success');
        addLine('[INJECT] Payload accepte par la machine cible !', 'success');
        await sleep(400);
        await startGame3();
        return;
      }
      state.g2 = step + 1;
    } else if (seq.includes(c)){
      await glitchBurst(3, 50);
      addLine('[ALERTE] Mauvais ordre ! Le firewall t\'a detecte.', 'error');
      addLine('[ALERTE] Connexion fermee. Retour a l\'etape 1/4.', 'error');
      addLine('>>> ETAPE 1/4 - tape "scan"', 'warning');
      state.g2 = 1;
    } else {
      addLine('Commande inconnue : '+cmd, 'error');
      addLine('Etape '+state.g2+'/4 attendue : "'+seq[state.g2-1]+'"', 'warning');
    }
  }
  else if (stage === 'game3'){
    if (c === 'help'){
      addLine('Convertis chaque cle binaire en decimal :', 'info');
      addLine('  01010101 = 0+64+0+16+0+4+0+1', 'info');
      addLine('  00110011 = 0+0+32+16+0+0+2+1', 'info');
      addLine('  01100110 = 0+64+32+0+0+4+2+0', 'info');
      addLine('Puis additionne les 3 et tape : sum <total>', 'info');
    } else if (c === 'clear'){
      output.innerHTML = '';
    } else if (c.startsWith('sum ')){
      const ans = parseInt(c.split(/\s+/)[1]);
      if (ans === 238){
        addLine('[ OK ] Calcul correct : 85 + 51 + 102 = 238', 'success');
        addLine('[ OK ] Acces au coffre-fort autorise...', 'success');
        await sleep(300);
        await finalReveal();
        return;
      } else if (isNaN(ans)){
        addLine('[ ERR ] Format invalide. Tape : sum <nombre>', 'error');
      } else {
        addLine('[ ERR ] Mauvais total : '+ans, 'error');
        addLine('Recalcule : convertis chaque binaire en decimal puis additionne.', 'warning');
      }
    } else {
      addLine('Commande inconnue. Utilise : sum <total>', 'error');
    }
  }
  else if (stage === 'done'){
    if (c === 'restart'){
      output.innerHTML = '';
      state = {};
      stage = 'boot';
      await bootSequence();
      return;
    } else if (c === 'clear'){
      output.innerHTML = '';
    } else {
      addLine('Mission terminee. Tape "restart" pour rejouer.', 'warning');
    }
  }

  showInput();
}

cmdInput.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter'){
    const v = cmdInput.value;
    if (!v.trim()) return;
    hideInput();
    await handleCommand(v);
  }
});

setInterval(()=>{
  if (stage !== 'boot' && Math.random() < 0.06 && inputLine.style.display === 'flex'){
    const msg = fakeCodes[Math.floor(Math.random()*fakeCodes.length)];
    const d = document.createElement('div');
    d.className = 'line dim';
    d.textContent = msg;
    output.insertBefore(d, inputLine);
    scrollDown();
  }
}, 2500);

document.addEventListener('click', ()=>{ if (inputLine.style.display==='flex') cmdInput.focus(); });
</script>
